name: Build Windows executable

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build single-file GUI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name COC-Bot --add-data "assets;assets" --add-data "config/attack_plans.json;config" --collect-all PySide6 --collect-all cv2 --collect-all rapidocr_onnxruntime main.py

      - name: Verify single-file output
        shell: pwsh
        run: |
          $exe = "dist/COC-Bot.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "Contents of dist:"
            Get-ChildItem dist -Recurse | Select-Object FullName
            throw "PyInstaller one-file executable not found at $exe"
          }

      # Actions artifacts are downloaded as a ZIP wrapper; extracting it yields only the EXE.
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: COC-Bot-Windows-x64
          path: dist/COC-Bot.exe
          if-no-files-found: error

      # Publish the EXE itself as a release asset, without wrapping it in another ZIP.
      - name: Publish release asset for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/COC-Bot.exe
