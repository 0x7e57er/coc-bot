name: Build Windows executable

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build GUI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name COC-Bot --add-data "assets;assets" --collect-all PySide6 --collect-all cv2 --collect-all rapidocr_onnxruntime main.py

      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          $exe = "dist/COC-Bot/COC-Bot.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "Contents of dist:"
            Get-ChildItem dist -Recurse | Select-Object FullName
            throw "PyInstaller onedir executable not found at $exe"
          }

      - name: Prepare portable folder
        shell: pwsh
        run: |
          $appDir = "dist/COC-Bot"
          New-Item -ItemType Directory -Force -Path "$appDir/config" | Out-Null
          Copy-Item config/attack_plans.json "$appDir/config/"
          Copy-Item README.md "$appDir/"

      # Actions artifacts are already downloaded as a ZIP. Upload the folder itself,
      # not a ZIP inside that ZIP, so users only extract once.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: COC-Bot-Windows-x64
          path: dist/COC-Bot/
          if-no-files-found: error

      # GitHub Releases need a single downloadable archive; create it only for tags.
      - name: Create release ZIP
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/COC-Bot -DestinationPath dist/COC-Bot-Windows-x64.zip -Force

      - name: Publish release asset for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/COC-Bot-Windows-x64.zip
